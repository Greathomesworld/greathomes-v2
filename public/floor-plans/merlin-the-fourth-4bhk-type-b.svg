<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#ffffff"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="25" y="25" width="750" height="40" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="50" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" fill="#0f172a">4 BHK PRESIDENTIAL — TYPE B DUPLEX (1,950 SQ.FT. CARPET)</text>
  <text x="750" y="50" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="end">SCALE: 1:100 | NTS</text>

  <g transform="translate(730, 100)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="0,-14 4,0 0,-4" fill="#E85D3F"/>
    <polygon points="0,-4 -4,0 0,-14" fill="#cbd5e1"/>
    <text x="0" y="-18" font-family="'Manrope', sans-serif" font-size="10" font-weight="800" fill="#E85D3F" text-anchor="middle">N</text>
  </g>

  <rect x="60" y="85" width="650" height="440" fill="#f8fafc" stroke="#1e293b" stroke-width="4"/>

  <!-- Double Height Living -->
  <rect x="60" y="85" width="320" height="260" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="220" y="195" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">DOUBLE HEIGHT LIVING &amp; LOUNGE</text>
  <text x="220" y="215" font-family="'Inter', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">30'0" × 17'0" (510 sq.ft.)</text>

  <!-- Sky Deck -->
  <rect x="60" y="345" width="320" height="90" fill="#fef2f2" stroke="#334155" stroke-width="2"/>
  <line x1="60" y1="435" x2="380" y2="435" stroke="#E85D3F" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="220" y="390" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">PANORAMIC SKY DECK</text>
  <text x="220" y="410" font-family="'Inter', sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">22'0" × 6'6"</text>

  <!-- Internal Staircase & Kitchen -->
  <rect x="60" y="435" width="160" height="90" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="140" y="480" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">MODULAR KITCHEN</text>

  <rect x="220" y="435" width="160" height="90" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="300" y="480" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">DUPLEX STAIRCASE</text>

  <!-- Master Suite Upper Level -->
  <rect x="380" y="85" width="330" height="230" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="545" y="160" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">PRESIDENTIAL SUITE</text>
  <text x="545" y="180" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">20'0" × 15'0"</text>

  <rect x="380" y="315" width="165" height="110" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="460" y="370" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">DRESS + JACUZZI</text>

  <rect x="545" y="315" width="165" height="210" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="625" y="405" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">SUITE 2</text>

  <rect x="380" y="425" width="165" height="100" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="460" y="475" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">FAMILY LOUNGE</text>

  <g transform="translate(35, 550)">
    <text x="0" y="0" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#334155">CARPET AREA: 1,950 SQ.FT.</text>
    <text x="180" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">BUILT-UP AREA: 2,390 SQ.FT.</text>
    <text x="360" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">SUPER BUILT-UP: 2,900 SQ.FT.</text>
    <text x="700" y="0" font-family="'Manrope', sans-serif" font-size="11" font-weight="800" fill="#0f172a" text-anchor="end">GREAT HOMES VERIFIED ARCHITECTURAL PLAN</text>
  </g>
</svg>
