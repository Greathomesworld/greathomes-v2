  <text x="140" y="475" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">KITCHEN</text>

  <rect x="210" y="430" width="140" height="90" fill="#ffffff" stroke="#334155" stroke-width="2"/>
