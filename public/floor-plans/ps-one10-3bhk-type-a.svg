  <rect x="350" y="295" width="140" height="110" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="420" y="350" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">M. BATH</text>

