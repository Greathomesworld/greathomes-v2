<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#ffffff"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="25" y="25" width="750" height="40" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="50" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" fill="#0f172a">2 BHK CLASSIC — TYPE B (665 SQ.FT. CARPET)</text>
  <text x="750" y="50" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="end">SCALE: 1:100 | NTS</text>

  <g transform="translate(730, 100)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="0,-14 4,0 0,-4" fill="#E85D3F"/>
    <polygon points="0,-4 -4,0 0,-14" fill="#cbd5e1"/>
    <text x="0" y="-18" font-family="'Manrope', sans-serif" font-size="10" font-weight="800" fill="#E85D3F" text-anchor="middle">N</text>
  </g>

  <rect x="90" y="90" width="580" height="420" fill="#f8fafc" stroke="#1e293b" stroke-width="4"/>

  <!-- Extended Living & Dining -->
  <rect x="90" y="90" width="310" height="250" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="245" y="185" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">EXPANDED LIVING &amp; DINING</text>
  <text x="245" y="205" font-family="'Inter', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">19'6" × 12'0" (234 sq.ft.)</text>
  <rect x="110" y="110" width="100" height="40" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="320" cy="150" r="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>

  <!-- Deck Balcony -->
  <rect x="90" y="340" width="310" height="85" fill="#fef2f2" stroke="#334155" stroke-width="2"/>
  <line x1="90" y1="425" x2="400" y2="425" stroke="#E85D3F" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="245" y="385" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">WIDE VIEW SUNDECK</text>
  <text x="245" y="405" font-family="'Inter', sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">13'0" × 4'6" (58 sq.ft.)</text>

  <!-- Kitchen with Utility -->
  <rect x="90" y="425" width="200" height="85" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <rect x="95" y="430" width="190" height="22" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="190" y="475" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">KITCHEN + UTILITY</text>
  <text x="190" y="495" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">8'6" × 7'0"</text>

  <!-- Master Bedroom -->
  <rect x="400" y="90" width="270" height="220" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <rect x="520" y="110" width="95" height="115" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="470" y="170" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">MASTER SUITE</text>
  <text x="470" y="190" font-family="'Inter', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">13'6" × 11'6"</text>

  <!-- Attached Master Bath -->
  <rect x="400" y="310" width="135" height="100" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="465" y="355" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">M. BATH</text>
  <text x="465" y="375" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">7'6" × 4'8"</text>

  <!-- Bedroom 2 -->
  <rect x="535" y="310" width="135" height="200" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <rect x="555" y="380" width="85" height="105" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="600" y="350" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">BEDROOM 2</text>
  <text x="600" y="370" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">11'6" × 10'6"</text>

  <!-- Common Bath -->
  <rect x="290" y="425" width="110" height="85" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="345" y="470" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">BATH</text>
  <text x="345" y="490" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">6'6" × 4'6"</text>

  <!-- Entry -->
  <path d="M 90 130 A 30 30 0 0 1 120 160" fill="none" stroke="#E85D3F" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="90" y1="130" x2="90" y2="160" stroke="#E85D3F" stroke-width="2"/>
  <text x="60" y="150" font-family="'Manrope', sans-serif" font-size="10" font-weight="700" fill="#E85D3F" text-anchor="end">ENTRY</text>

  <g transform="translate(35, 540)">
    <text x="0" y="0" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#334155">CARPET AREA: 665 SQ.FT.</text>
    <text x="180" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">BUILT-UP AREA: 810 SQ.FT.</text>
    <text x="360" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">SUPER BUILT-UP: 990 SQ.FT.</text>
    <text x="700" y="0" font-family="'Manrope', sans-serif" font-size="11" font-weight="800" fill="#0f172a" text-anchor="end">GREAT HOMES VERIFIED ARCHITECTURAL PLAN</text>
  </g>
</svg>
