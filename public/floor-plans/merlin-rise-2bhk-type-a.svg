<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Border & Title Block -->
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="25" y="25" width="750" height="40" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="50" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" fill="#0f172a">2 BHK CLASSIC — TYPE A (640 SQ.FT. CARPET)</text>
  <text x="750" y="50" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="end">SCALE: 1:100 | NTS</text>

  <!-- North Compass -->
  <g transform="translate(730, 100)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="0,-14 4,0 0,-4" fill="#E85D3F"/>
    <polygon points="0,-4 -4,0 0,-14" fill="#cbd5e1"/>
    <text x="0" y="-18" font-family="'Manrope', sans-serif" font-size="10" font-weight="800" fill="#E85D3F" text-anchor="middle">N</text>
  </g>

  <!-- Main Outer Walls (Heavy Stroke) -->
  <rect x="100" y="90" width="560" height="420" fill="#f8fafc" stroke="#1e293b" stroke-width="4"/>

  <!-- Room 1: Living & Dining (Left side) -->
  <rect x="100" y="90" width="280" height="260" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="240" y="190" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">LIVING &amp; DINING</text>
  <text x="240" y="210" font-family="'Inter', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">18'0" × 11'6" (207 sq.ft.)</text>
  <!-- Living Furniture outlines -->
  <rect x="120" y="110" width="90" height="35" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="120" y="150" width="50" height="25" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="280" cy="140" r="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>

  <!-- Balcony attached to living -->
  <rect x="100" y="350" width="280" height="80" fill="#fef2f2" stroke="#334155" stroke-width="2"/>
  <line x1="100" y1="430" x2="380" y2="430" stroke="#E85D3F" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="240" y="395" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">BALCONY</text>
  <text x="240" y="415" font-family="'Inter', sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">11'6" × 4'0" (46 sq.ft.)</text>

  <!-- Kitchen (Bottom Left) -->
  <rect x="100" y="430" width="180" height="80" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <rect x="105" y="435" width="170" height="20" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="150" cy="445" r="5" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
  <text x="190" y="480" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">KITCHEN</text>
  <text x="190" y="498" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">8'0" × 6'6"</text>

  <!-- Master Bedroom (Top Right) -->
  <rect x="380" y="90" width="280" height="210" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <!-- Bed Outline -->
  <rect x="490" y="110" width="90" height="110" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="495" y="115" width="35" height="20" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="540" y="115" width="35" height="20" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="450" y="160" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">MASTER BEDROOM</text>
  <text x="450" y="180" font-family="'Inter', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">13'0" × 11'0" (143 sq.ft.)</text>

  <!-- Attached Master Toilet -->
  <rect x="380" y="300" width="140" height="100" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="450" y="345" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">M. TOILET</text>
  <text x="450" y="365" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">7'0" × 4'6"</text>

  <!-- Bedroom 2 (Bottom Right) -->
  <rect x="520" y="300" width="140" height="210" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <rect x="540" y="380" width="80" height="100" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="590" y="345" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">BEDROOM 2</text>
  <text x="590" y="365" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">11'0" × 10'0"</text>

  <!-- Common Toilet -->
  <rect x="280" y="430" width="100" height="80" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="330" y="475" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">TOILET</text>
  <text x="330" y="492" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">6'0" × 4'6"</text>

  <!-- Main Entry Door & Swing -->
  <path d="M 100 130 A 30 30 0 0 1 130 160" fill="none" stroke="#E85D3F" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="100" y1="130" x2="100" y2="160" stroke="#E85D3F" stroke-width="2"/>
  <polygon points="85,145 95,145 95,140 100,147 95,154 95,149 85,149" fill="#E85D3F"/>
  <text x="70" y="150" font-family="'Manrope', sans-serif" font-size="10" font-weight="700" fill="#E85D3F" text-anchor="end">ENTRY</text>

  <!-- Dimensions and Legend -->
  <g transform="translate(35, 540)">
    <text x="0" y="0" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#334155">CARPET AREA: 640 SQ.FT.</text>
    <text x="180" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">BUILT-UP AREA: 780 SQ.FT.</text>
    <text x="360" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">SUPER BUILT-UP: 950 SQ.FT.</text>
    <text x="700" y="0" font-family="'Manrope', sans-serif" font-size="11" font-weight="800" fill="#0f172a" text-anchor="end">GREAT HOMES VERIFIED ARCHITECTURAL PLAN</text>
  </g>
</svg>
