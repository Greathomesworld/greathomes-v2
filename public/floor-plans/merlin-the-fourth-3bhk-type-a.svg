    <text x="180" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">BUILT-UP AREA: 1,520 SQ.FT.</text>
    <text x="360" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">SUPER BUILT-UP: 1,850 SQ.FT.</text>
    <text x="700" y="0" font-family="'Manrope', sans-serif" font-size="11" font-weight="800" fill="#0f172a" text-anchor="end">GREAT HOMES VERIFIED ARCHITECTURAL PLAN</text>
