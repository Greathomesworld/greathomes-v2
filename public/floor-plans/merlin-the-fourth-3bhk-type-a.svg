  <text x="215" y="380" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">LAKE VIEW DECK</text>
  <text x="215" y="400" font-family="'Inter', sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">16'0" × 5'6"</text>

  <rect x="360" y="85" width="330" height="220" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="525" y="160" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">MASTER BEDROOM SUITE</text>
  <text x="525" y="180" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">16'6" × 13'6"</text>

  <rect x="360" y="305" width="150" height="110" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="435" y="360" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">M. BATH</text>

  <rect x="510" y="305" width="180" height="215" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="600" y="390" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">BEDROOM 2</text>

  <rect x="70" y="425" width="150" height="95" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="145" y="475" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">KITCHEN</text>

  <rect x="220" y="425" width="140" height="95" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="290" y="475" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">BEDROOM 3</text>

  <rect x="360" y="415" width="150" height="105" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="435" y="470" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">COMMON BATH</text>

  <g transform="translate(35, 545)">
