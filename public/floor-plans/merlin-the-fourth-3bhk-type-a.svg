  <text x="215" y="200" font-family="'Inter', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">24'0" × 14'0" (336 sq.ft.)</text>

  <rect x="70" y="335" width="290" height="90" fill="#fef2f2" stroke="#334155" stroke-width="2"/>
