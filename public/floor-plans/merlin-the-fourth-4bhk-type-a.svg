<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#ffffff"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="25" y="25" width="750" height="40" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="50" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" fill="#0f172a">4 BHK PRESIDENTIAL — TYPE A (1,750 SQ.FT. CARPET)</text>
  <text x="750" y="50" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="end">SCALE: 1:100 | NTS</text>

  <g transform="translate(730, 100)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="0,-14 4,0 0,-4" fill="#E85D3F"/>
    <polygon points="0,-4 -4,0 0,-14" fill="#cbd5e1"/>
    <text x="0" y="-18" font-family="'Manrope', sans-serif" font-size="10" font-weight="800" fill="#E85D3F" text-anchor="middle">N</text>
  </g>

  <rect x="60" y="85" width="650" height="440" fill="#f8fafc" stroke="#1e293b" stroke-width="4"/>

  <!-- Private Lift Foyer -->
  <rect x="60" y="85" width="100" height="120" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="110" y="145" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">PVT LIFT FOYER</text>

  <!-- Palatial Living & Dining -->
  <rect x="160" y="85" width="310" height="260" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="315" y="195" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">PALATIAL LIVING &amp; DINING</text>
  <text x="315" y="215" font-family="'Inter', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">28'0" × 16'0" (448 sq.ft.)</text>

  <!-- Double Width Balcony -->
  <rect x="160" y="345" width="310" height="90" fill="#fef2f2" stroke="#334155" stroke-width="2"/>
  <line x1="160" y1="435" x2="470" y2="435" stroke="#E85D3F" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="315" y="390" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">LAKE-VIEW DECK</text>
  <text x="315" y="410" font-family="'Inter', sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">20'0" × 6'0"</text>

  <!-- Kitchen & Servants Room -->
  <rect x="60" y="345" width="100" height="180" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="110" y="420" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">CHEF KITCHEN</text>
  <text x="110" y="490" font-family="'Inter', sans-serif" font-size="9" fill="#64748b" text-anchor="middle">+ STAFF ROOM</text>

  <!-- Presidential Master Suite -->
  <rect x="470" y="85" width="240" height="230" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="590" y="160" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">MASTER SUITE</text>
  <text x="590" y="180" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">18'0" × 14'0"</text>

  <!-- Master Bath with Tub -->
  <rect x="470" y="315" width="120" height="120" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="530" y="375" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">M. BATH + TUB</text>

  <!-- Suite 2 -->
  <rect x="590" y="315" width="120" height="210" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="650" y="405" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">SUITE 2</text>
  <text x="650" y="425" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">14'0" × 12'0"</text>

  <!-- Bedroom 3 & 4 (Bottom) -->
  <rect x="160" y="435" width="155" height="90" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="235" y="480" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">BEDROOM 3</text>

  <rect x="315" y="435" width="155" height="90" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="390" y="480" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">BEDROOM 4</text>

  <g transform="translate(35, 550)">
    <text x="0" y="0" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#334155">CARPET AREA: 1,750 SQ.FT.</text>
    <text x="180" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">BUILT-UP AREA: 2,150 SQ.FT.</text>
    <text x="360" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">SUPER BUILT-UP: 2,600 SQ.FT.</text>
    <text x="700" y="0" font-family="'Manrope', sans-serif" font-size="11" font-weight="800" fill="#0f172a" text-anchor="end">GREAT HOMES VERIFIED ARCHITECTURAL PLAN</text>
  </g>
</svg>
