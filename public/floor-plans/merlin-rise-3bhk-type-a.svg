<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#ffffff"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="25" y="25" width="750" height="40" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="50" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" fill="#0f172a">3 BHK GRANDE — TYPE A (890 SQ.FT. CARPET)</text>
  <text x="750" y="50" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="end">SCALE: 1:100 | NTS</text>

  <g transform="translate(730, 100)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="0,-14 4,0 0,-4" fill="#E85D3F"/>
    <polygon points="0,-4 -4,0 0,-14" fill="#cbd5e1"/>
    <text x="0" y="-18" font-family="'Manrope', sans-serif" font-size="10" font-weight="800" fill="#E85D3F" text-anchor="middle">N</text>
  </g>

  <!-- Outer Walls -->
  <rect x="70" y="85" width="620" height="435" fill="#f8fafc" stroke="#1e293b" stroke-width="4"/>

  <!-- Foyer / Entry -->
  <rect x="70" y="85" width="100" height="85" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="120" y="130" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">FOYER</text>

  <!-- Grand Living & Dining -->
  <rect x="170" y="85" width="280" height="260" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="310" y="185" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">GRAND LIVING &amp; DINING</text>
  <text x="310" y="205" font-family="'Inter', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">21'0" × 13'0" (273 sq.ft.)</text>
  <rect x="190" y="105" width="110" height="45" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="390" cy="140" r="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>

  <!-- Sundeck Balcony -->
  <rect x="170" y="345" width="280" height="85" fill="#fef2f2" stroke="#334155" stroke-width="2"/>
  <line x1="170" y1="430" x2="450" y2="430" stroke="#E85D3F" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="310" y="390" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">PANORAMIC SUNDECK</text>
  <text x="310" y="410" font-family="'Inter', sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">13'0" × 5'0" (65 sq.ft.)</text>

  <!-- Kitchen & Utility (Bottom Left) -->
  <rect x="70" y="345" width="100" height="175" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <rect x="75" y="350" width="90" height="20" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="120" y="425" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">KITCHEN</text>
  <text x="120" y="445" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">9'6" × 7'6"</text>
  <text x="120" y="480" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">+ UTILITY</text>

  <!-- Master Bedroom Suite (Top Right) -->
  <rect x="450" y="85" width="240" height="210" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <rect x="550" y="105" width="100" height="115" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="500" y="160" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">MASTER SUITE</text>
  <text x="500" y="180" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">14'0" × 12'0"</text>

  <!-- Master Bath & Dress -->
  <rect x="450" y="295" width="120" height="110" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="510" y="345" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">M. BATH</text>
  <text x="510" y="365" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">8'0" × 5'0"</text>

  <!-- Bedroom 2 (Bottom Right) -->
  <rect x="570" y="295" width="120" height="225" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <rect x="585" y="390" width="85" height="100" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="630" y="345" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">BEDROOM 2</text>
  <text x="630" y="365" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">12'0" × 11'0"</text>

  <!-- Bedroom 3 (Bottom Center) -->
  <rect x="330" y="430" width="120" height="90" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="390" y="475" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">BEDROOM 3</text>
  <text x="390" y="495" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">11'0" × 10'0"</text>

  <!-- Common Bath -->
  <rect x="450" y="405" width="120" height="115" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="510" y="460" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">COMMON BATH</text>
  <text x="510" y="480" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">7'0" × 4'6"</text>

  <!-- Entry Door -->
  <path d="M 70 120 A 30 30 0 0 1 100 150" fill="none" stroke="#E85D3F" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="70" y1="120" x2="70" y2="150" stroke="#E85D3F" stroke-width="2"/>
  <text x="50" y="138" font-family="'Manrope', sans-serif" font-size="10" font-weight="700" fill="#E85D3F" text-anchor="end">ENTRY</text>

  <g transform="translate(35, 545)">
    <text x="0" y="0" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#334155">CARPET AREA: 890 SQ.FT.</text>
    <text x="180" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">BUILT-UP AREA: 1,080 SQ.FT.</text>
    <text x="360" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">SUPER BUILT-UP: 1,320 SQ.FT.</text>
    <text x="700" y="0" font-family="'Manrope', sans-serif" font-size="11" font-weight="800" fill="#0f172a" text-anchor="end">GREAT HOMES VERIFIED ARCHITECTURAL PLAN</text>
  </g>
</svg>
