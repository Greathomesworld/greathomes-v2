<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" class="gh-illustration gh-illustration-location-discovery">
  <rect width="240" height="180" rx="12" fill="#FAFAF8" class="gh-ill-bg" />
  <circle cx="120" cy="70" r="40" fill="#E85D3F" fill-opacity="0.08" />

  <!-- Isometric / Angled Urban Road Grid -->
  <path d="M30 135L100 100L210 125" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M100 100L100 45" stroke="#111111" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round" />
  <path d="M40 90L100 100L160 145" stroke="#111111" stroke-width="1.25" stroke-linecap="round" stroke-opacity="0.25" />

  <!-- Stylized Kolkata Residential Blocks -->
  <rect x="45" y="65" width="34" height="42" rx="2" fill="#FFFFFF" stroke="#111111" stroke-width="1.5" />
  <rect x="52" y="73" width="8" height="8" rx="1" fill="#111111" fill-opacity="0.06" />
  <rect x="64" y="73" width="8" height="8" rx="1" fill="#111111" fill-opacity="0.06" />
  <rect x="52" y="87" width="8" height="8" rx="1" fill="#111111" fill-opacity="0.06" />
  <rect x="64" y="87" width="8" height="8" rx="1" fill="#111111" fill-opacity="0.06" />

  <rect x="155" y="75" width="42" height="50" rx="2" fill="#FFFFFF" stroke="#111111" stroke-width="1.5" />
  <rect x="164" y="85" width="10" height="10" rx="1" fill="#111111" fill-opacity="0.06" />
  <rect x="180" y="85" width="10" height="10" rx="1" fill="#111111" fill-opacity="0.06" />

  <!-- Prominent Location Discovery Pin (Terracotta Signature) -->
  <g transform="translate(105, 30)">
    <path d="M15 0C6.716 0 0 6.716 0 15C0 26.25 15 42 15 42C15 42 30 26.25 30 15C30 6.716 23.284 0 15 0Z" fill="#E85D3F" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />
    <circle cx="15" cy="15" r="5.5" fill="#FFFFFF" />
  </g>

  <!-- Pulse Rings Around Location Target -->
  <ellipse cx="120" cy="74" rx="24" ry="10" stroke="#E85D3F" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.6" />
